<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>ReJivan</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230e1730'/%3E%3Cpath%20d='M14%2036h10l5-13%207%2028%206-15h8'%20fill='none'%20stroke='%2334d0ac'%20stroke-width='5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>/* ============================================================
   ReJivan — clinical product UI (v3 design system)
   Neutral clinical surfaces, thin 1px borders, muted blue actions,
   teal reserved for healthy, amber for caution, red for danger.
   ============================================================ */
:root{
  --bg:#f4f6fa;            /* app canvas */
  --surface:#ffffff;       /* panels, tables, wells */
  --surface-2:#eef2f8;     /* table headers, hover */
  --surface-3:#f7f9fc;
  --line:#e3e8ef;          /* thin borders */
  --line-2:#ccd7e5;        /* stronger borders, inputs */
  --ink:#17233c;           /* primary text (deep navy) */
  --ink-2:#43526b;         /* secondary text */
  --ink-3:#7b89a1;         /* tertiary / meta text */
  --primary:#2c6bd9;       /* muted blue — primary action */
  --primary-strong:#2357b8;
  --primary-soft:#ebf2fd;
  --ok:#0c9d64;            /* teal green — healthy only */
  --ok-soft:#e8f7f0;
  --warn:#92690a;          /* amber — caution */
  --warn-soft:#fbf3e1;
  --danger:#cf3f3f;        /* red — danger / critical only */
  --danger-soft:#fbecec;
  --r:6px; --r-sm:4px;
  --shadow:0 1px 2px rgba(22,35,60,.05);
  --shadow-2:0 4px 16px rgba(22,35,60,.08);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:650;color:var(--ink);margin:0}
h1{font-size:19px}h2{font-size:16px}h3{font-size:14.5px}h4{font-size:13.5px}
p{margin:0}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
.nums{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12px}

/* ---- Buttons: functional, not decorative ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--primary);color:#fff;border:1px solid var(--primary);
  border-radius:var(--r);padding:7px 14px;font-size:13px;font-weight:600;
  cursor:pointer;line-height:1.3;height:34px;white-space:nowrap}
.btn:hover{background:var(--primary-strong);border-color:var(--primary-strong)}
.btn:active{transform:translateY(0)}
.btn.small{padding:4px 10px;height:28px;font-size:12px;font-weight:500}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);font-weight:500}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn.ghost.primary{color:var(--primary);border-color:var(--line-2)}
.btn.ghost.primary:hover{background:var(--primary-soft);border-color:var(--primary)}
.btn.danger{background:var(--danger);border-color:var(--danger)}

/* ---- Inputs ---- */
input,select,textarea{width:100%;height:34px;padding:6px 10px;border:1px solid var(--line-2);
  border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(44,107,217,.15)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:10px 0 4px}

/* ---- App shell ---- */
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:60;height:54px;display:flex;align-items:center;gap:14px;
  background:var(--surface);border-bottom:1px solid var(--line);padding:0 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
  background:#0d8f66;border-radius:7px}
.brandmark svg{width:19px;height:19px}
.brandtext{line-height:1.15;min-width:0}
.brandtext .logo{font-size:15.5px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.brandtext .tag{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topctx{display:flex;align-items:center;gap:8px;min-width:0;padding:5px 12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface-3);height:32px}
.topctx svg{width:15px;height:15px;color:var(--primary)}
.topctx span{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topactions{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.iconbtn{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;background:none;border-radius:var(--r);color:var(--ink-2);cursor:pointer;position:relative}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.drop{position:relative}
.icount{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 3px;font-size:9.5px;font-weight:700;
  background:var(--danger);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid #fff}
.icount.zero{display:none}
.topsel{height:30px;font-size:12.5px;padding:4px 8px;width:auto;border:1px solid var(--line-2)}
.profile{display:flex;align-items:center;gap:8px;padding:3px 6px 3px 3px;border:1px solid var(--line);border-radius:var(--r);height:34px}
.profile .initials{width:26px;height:26px;border-radius:var(--r-sm);background:var(--ok);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.profile .who{font-size:12px;color:var(--ink);line-height:1.1;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;width:34px;height:34px}

/* ---- Sidebar ---- */
.layout{display:flex;flex:1;min-height:0;align-items:stretch}
.sidebar{width:212px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.navlabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  padding:4px 10px 6px;margin-bottom:2px}
.navitem{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  border:1px solid transparent;border-radius:var(--r);background:none;color:var(--ink-2);
  font-size:13.5px;font-weight:500;cursor:pointer;text-align:left}
.navitem svg{width:17px;height:17px;flex:none;color:var(--ink-3)}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem:hover svg{color:var(--ink-2)}
.navitem.active{background:var(--primary-soft);color:var(--primary-strong);font-weight:600}
.navitem.active svg{color:var(--primary)}
.navitem.active::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--primary)}
.sidefoot{margin-top:auto;padding:10px 8px 4px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.nav-backdrop{display:none}

/* ---- Main ---- */
.main{flex:1;min-width:0;background:var(--bg);display:flex;flex-direction:column}
.main .inner{flex:1;padding:22px 26px;display:flex;flex-direction:column;gap:16px;min-height:0}
.pagehead{display:flex;align-items:flex-start;gap:12px}
.pagehead .ph-t{flex:1;min-width:0}
.pagehead h1{margin:0;display:flex;align-items:center;gap:10px}
.pagehead .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.pagehead .ph-actions{display:flex;align-items:center;gap:8px}
.simpill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line-2);
  border-radius:999px;background:var(--surface);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--warn)}
.simpill .dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.simline{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);
  border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);font-size:12.5px;color:#5b4410}
.simline b{white-space:nowrap}
.simline svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--warn)}
.regional{display:flex;gap:8px;align-items:center;padding:7px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);font-size:12px;color:var(--ink-2)}
.regional svg{width:15px;height:15px;color:var(--primary);flex:none}

/* ---- Panels & tables ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel .ph h3{flex:1;min-width:0}
.panel .ph .meta{font-size:11.5px;color:var(--ink-3)}
.panel .pb{padding:16px}
.tblwrap{overflow-x:auto}
table.cli{width:100%;border-collapse:collapse;font-size:13px}
table.cli th{position:sticky;top:0;text-align:left;font-size:10.5px;font-weight:650;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.cli td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.cli tbody tr:nth-child(even){background:var(--surface-3)}
table.cli tbody tr:last-child td{border-bottom:none}
table.cli tr:hover td{background:#f2f6fc}
.empty{color:var(--ink-3);font-size:12.5px;padding:14px;text-align:center}

/* ---- Status chips (text + dot, never color alone) ---- */
.st{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-size:11.5px;font-weight:600;white-space:nowrap}
.st .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.st.ok{background:var(--ok-soft);border-color:#cfe9de;color:#0b6a47}
.st.ok .dot{background:var(--ok)}
.st.caution{background:var(--warn-soft);border-color:#ecd9ad;color:#7a5408}
.st.caution .dot{background:var(--warn)}
.st.danger{background:var(--danger-soft);border-color:#ecc9c9;color:#a12626}
.st.danger .dot{background:var(--danger)}
.st.neutral .dot{background:var(--ink-3)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-size:11px;font-weight:600}
.tag.blue{background:var(--primary-soft);border-color:#c6dcf6;color:#1f5591}

/* ---- Dashboard ---- */
.dashgrid{display:flex;gap:22px;align-items:flex-start}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.rail{width:302px;flex:none;display:flex;flex-direction:column;gap:16px}
.ptheader{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 16px}
.ptheader .pt-id{flex:1;min-width:200px}
.ptheader h2{margin:0;display:flex;align-items:center;gap:10px}
.ptheader .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ptheader .side{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.updated{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3)}
.updated svg{width:13px;height:13px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r)}
.sum .n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.sum .l{display:block;font-size:11px;color:var(--ink-3);line-height:1.1}
.sum .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sum.caution .dot{background:var(--warn)}
.sum.danger .dot{background:var(--danger)}
.sum.sum-crit{background:var(--danger-soft);border-color:#ecc9c9}
.sum.sum-crit .l{color:#8f2b2b}

/* vitals table */
.ptrow td{background:var(--surface-3);border-bottom:1px solid var(--line)}
.ptrow .g-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.ptrow .g-head b{font-size:13.5px}
.ptrow .g-head .sub{font-size:12px;color:var(--ink-3)}
.ptrow .g-side{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta-cell{font-size:11.5px;color:var(--ink-3)}
.tr-tech td{background:var(--surface-3);padding:8px 14px;font-size:11.5px;color:var(--ink-3)}
.tr-tech .devs{display:inline-flex;flex-wrap:wrap;gap:4px;margin-right:8px}
.devchip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:10.5px;color:var(--ink-2)}
.devchip .dot{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.devchip .dot.off{background:var(--ink-3)}
tr.vt td.v-v{font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums}
tr.vt td.v-v .u{font-weight:500;font-size:11.5px;color:var(--ink-3);margin-left:3px}
td.v-meta{font-size:11.5px;color:var(--ink-3)}
.trend{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;
  font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface-2)}
.trend.up{color:var(--danger)}
.trend.down{color:var(--ok)}
.trend.flat{color:var(--ink-3)}
.ref{font-size:11.5px;color:var(--ink-3);white-space:nowrap}

/* rail panels */
.rail-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rail-panel .rp-h{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line)}
.rail-panel .rp-h h3{flex:1;font-size:13px}
.rail-panel .rp-h .lnk{font-size:11.5px;font-weight:600}
.ralert{display:flex;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.ralert:last-child{border-bottom:none}
.ralert .rdot{width:7px;height:7px;border-radius:50%;background:var(--ok);margin-top:5px;flex:none}
.ralert.caution .rdot{background:var(--warn)}
.ralert.danger .rdot{background:var(--danger)}
.ralert .rtxt{flex:1;min-width:0}
.ralert b{display:block;font-size:12px}
.ralert .rmsg{color:var(--ink-2);line-height:1.35}
.ralert .rtime{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.meditem{display:flex;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.meditem:last-child{border-bottom:none}
.meditem .mic{width:26px;height:26px;flex:none;border-radius:6px;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:12px}
.meditem .mbody{flex:1;min-width:0}
.meditem b{font-size:12.5px}
.meditem .msub{font-size:11.5px;color:var(--ink-3)}
.rail-note{font-size:11px;color:var(--ink-3);padding:8px 13px}

/* ---- Medicines ---- */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.toolbar h2{flex:1;min-width:0}
.toolbar .sub{font-size:12px;color:var(--ink-3)}

/* ---- Camera zones ---- */
.zonegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.zonerow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  display:flex;align-items:center;gap:12px}
.zonerow .zic{width:32px;height:32px;flex:none;border-radius:6px;background:var(--surface-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center}
.zonerow .zic svg{width:16px;height:16px}
.zonerow .zt{flex:1;min-width:0}
.zonerow .zt b{font-size:13.5px}
.zonerow .zt .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.eventrow{display:flex;gap:10px;align-items:flex-start;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.eventrow:last-child{border-bottom:none}
.eventrow .et{flex:1;min-width:0}
.eventrow .et b{font-size:12px}
.eventrow .etime{font-size:10.5px;color:var(--ink-3)}

/* ---- Ward ---- */
.ward-table td{vertical-align:middle}
.wmap{width:10px}
.sigcell{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.wprio{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:11px;font-weight:650;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.wprio .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.wprio.hi{background:var(--danger-soft);border-color:#ecc9c9;color:#a12626}.wprio.hi .dot{background:var(--danger)}
.wprio.mid{background:var(--warn-soft);border-color:#ecd9ad;color:#7a5408}.wprio.mid .dot{background:var(--warn)}

/* ---- Alerts / calls ---- */
.aline{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.aline:last-child{border-bottom:none}
.aline .atxt{flex:1;min-width:0}
.aline b{font-size:12px}
.aline .amsg{color:var(--ink-2)}
.aline .atime{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.calldiv{display:flex;flex-direction:column;gap:6px}
.callstep{display:flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-3);font-size:12.5px}
.callstep .cst-ic{width:24px;height:24px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--ink-3)}
.callstep .cst-ic svg{width:13px;height:13px}
.callstep.answered{border-color:#d3e8df;background:var(--ok-soft)}
.callstep.unanswered{border-color:#ecc9c9;background:var(--danger-soft)}
.callstep.dialing{border-color:#ecd9ad;background:var(--warn-soft)}
.calllog{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.callcard-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.callcard-head .muted2{font-size:11.5px;color:var(--ink-3);margin-top:3px}

/* ---- Devices ---- */
.devtable td.v-meta{font-size:11px}
.batbar{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.batbar .bw{width:52px;height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.batbar .bf{display:block;height:100%;background:var(--ok)}
.batbar .bf.low{background:var(--danger)}
.batbar .bf.mid{background:var(--warn)}
.sigbars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.sigbars span{width:3px;border-radius:1px;background:var(--line-2)}
.sigbars span.on{background:var(--ok)}
.measures{display:inline-flex;flex-wrap:wrap;gap:4px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.catcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:7px}
.catcard .cc-h{display:flex;gap:8px;align-items:flex-start}
.catcard .cc-h h4{flex:1}
.catcard .price{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.catcard .cc-meta{font-size:11.5px;color:var(--ink-3)}

/* ---- Modals ---- */
.modal{position:fixed;inset:0;background:rgba(20,28,45,.45);display:none;align-items:flex-start;
  justify-content:center;padding:5vh 16px;z-index:100;overflow-y:auto}
.modal.show{display:flex}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-2);
  width:min(430px,94vw);padding:20px}
.modal-card h3{margin:0 0 6px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ---- Cam ---- */
.cam-stage{position:relative;background:#101a26;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.cam-stage canvas{display:block;width:100%}
.cam-hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:10.5px;
  font-weight:700;letter-spacing:.05em;background:rgba(10,14,22,.72);color:#e8f5ef;border:1px solid rgba(255,255,255,.12)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#34d0ac}
.cam-hud .clock{font-size:11px;color:#9fafc4;font-variant-numeric:tabular-nums}

/* ---- Login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow-2);padding:26px 26px 20px}
.login-head{text-align:center;margin-bottom:18px}
.login-head .brandmark{width:44px;height:44px;border-radius:10px;margin:0 auto 10px}
.login-head .brandmark svg{width:28px;height:28px}
.login-head h1{font-size:22px}
.login-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.login-form{display:flex;flex-direction:column;gap:10px}
.err{color:var(--danger);font-size:12.5px;font-weight:600}
.okmsg{color:var(--ok);font-size:12.5px;font-weight:600}
.link{margin-top:10px;text-align:center;font-size:12.5px;color:var(--primary);cursor:pointer;font-weight:600}
.demo{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.dlabel{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.dimport{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface-3);color:var(--ink);font-size:12px;cursor:pointer}
.dimport:hover{background:var(--primary-soft);border-color:var(--line-2)}
.dimport .demo-mail{font-weight:600;font-variant-numeric:tabular-nums}
.dimport .demo-pass{color:var(--ink-3)}
.dimport .demo-role{margin-left:auto;font-size:11px;color:var(--primary);font-weight:600;white-space:nowrap}
.signin-note{display:flex;gap:7px;align-items:center;margin-top:14px;padding:8px 10px;background:var(--surface-3);
  border:1px solid var(--line);border-radius:var(--r);font-size:11.5px;color:var(--ink-3)}
.signin-note svg{width:14px;height:14px;color:var(--primary);flex:none}
.signin-note b{color:var(--ink-2)}

/* ---- Footer ---- */
.foot{margin-top:auto;padding:14px 0 6px;text-align:center;font-size:11px;color:var(--ink-3)}
.foot .fsep{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.clearview{animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(1px)}to{opacity:1;transform:none}}

/* ---- Responsive ---- */
@media (max-width:1180px){
  .sidefoot{display:none}
  .rail{width:270px}
}
@media (max-width:1040px){
  .sidebar{width:56px;padding:12px 8px}
  .navitem{justify-content:center;padding:9px 0}
  .navitem span,.navlabel{display:none}
  .navitem.active::before{left:-8px}
  .rail{width:250px}
}
@media (max-width:860px){
  .topbar{padding:0 12px}
  .menu-btn{display:inline-flex}
  .layout{position:relative}
  .sidebar{position:fixed;left:0;top:54px;bottom:0;width:236px;z-index:70;transform:translateX(-105%);
    transition:transform .16s ease;box-shadow:none;padding:14px 10px}
  .sidebar.open{transform:none;box-shadow:0 10px 30px rgba(20,28,45,.18)}
  .sidebar .navlabel,.sidebar .navitem span{display:block}
  .navitem{justify-content:flex-start;padding:9px 10px}
  .navitem.active::before{left:-10px}
  .nav-backdrop{display:block;position:fixed;inset:54px 0 0 0;z-index:65;background:rgba(20,28,45,.35);opacity:0;
    visibility:hidden;transition:opacity .16s}
  .nav-backdrop.show{opacity:1;visibility:visible}
  .brandtext .tag{display:none}
  .dashgrid{flex-direction:column}
  .rail{width:100%}
  .main .inner{padding:16px}
}
@media (max-width:620px){
  .main .inner{padding:12px}
  .profile .who{display:none}
  .topsel{display:none}
  table.cli th,table.cli td{padding:7px 10px}
  .ptheader .side{width:100%}
  .sumrow{grid-template-columns:repeat(2,1fr)}
  .zonegrid{grid-template-columns:1fr}
  .catgrid{grid-template-columns:1fr}
}</style>

<script>
const LANG = {};
let curLang = localStorage.getItem('rejivan_lang') || 'en';
let token = localStorage.getItem('rejivan_token') || '';
let me = null;
let mode = 'login'; // login | register

const state = { view: 'dashboard', patients: [], alerts: [], escalations: [], meds: [], zones: [], camEvents: [], calls: [] };
let live = { zoneId: null, connected: false, timer: null, raf: null, frame: null, name: '' };

function t(key){ return LANG[curLang] && LANG[curLang][key] ? LANG[curLang][key] : (LANG.en?.[key] || key); }
function pname(id, fallback){ return (LANG[curLang]?.patientNames?.[id]) || fallback || id || ''; }
function stripName(msg, name){
  if (!msg || !name) return msg || '';
  if (msg.startsWith(name)) return msg.slice(name.length).replace(/^\s*[—–-]\s*/, '');
  return msg;
}
function walk(node){ node.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n)); }
function walkPlaceholders(node){ node.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18n)); }

function applyI18n(){
  curLang = localStorage.getItem('rejivan_lang') || 'en';
  const sel = document.getElementById('langSel');
  if (sel) sel.value = curLang;
  document.querySelectorAll('[id]').forEach(()=>{}); // no-op
  walkForTrees();
  document.title = t('appName');
}
function walkForTrees(){
  walk(document.getElementById('loginScreen'));
  walk(document.getElementById('app'));
  walk(document.getElementById('medModal'));
  walk(document.getElementById('liveModal'));
  walkPlaceholders(document.getElementById('loginScreen'));
  walk(dynamicEl());
}
function dynamicEl(){ return document.getElementById('views'); }
function setLoginStrings(){
  document.getElementById('liSubmit').textContent = t(mode === 'login' ? 'login_btn' : 'register_btn');
  document.getElementById('liSwitch').innerHTML = mode === 'login'
    ? t('switch_to_register') : t('switch_to_login');
  document.getElementById('liName').style.display = mode === 'register' ? '' : 'none';
  document.getElementById('liRole').style.display = mode === 'register' ? '' : 'none';
}

async function loadLang(){
  const r = await fetch('/lang.json');
  Object.assign(LANG, await r.json());
}

async function api(path, opts={}){
  opts.headers = opts.headers || {};
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (opts.body && typeof opts.body !== 'string') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith('/api/auth/')) {
    token = '';
    localStorage.removeItem('rejivan_token');
    showLogin();
    const err = document.getElementById('liErr');
    if (err) err.textContent = t('auth_required');
    throw new Error('auth_required');
  }
  return data;
}

// ---- Auth UI --------------------------------------------------------------
function showLogin(){ document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('app').style.display = 'none'; walkForTrees(); setLoginStrings(); }
function showApp(){ document.getElementById('loginScreen').style.display = 'none'; document.getElementById('app').style.display = 'block'; walkForTrees(); buildNav(); }

async function doLogin(){
  const email = document.getElementById('liEmail').value.trim();
  const pass = document.getElementById('liPass').value.trim();
  const err = document.getElementById('liErr');
  const ok = document.getElementById('liOk');
  err.textContent = ''; ok.textContent = '';
  if (!email || !pass){ err.textContent = t('wrong_creds'); return; }
  if (mode === 'register') {
    const name = document.getElementById('liName').value.trim();
    const role = document.getElementById('liRole').value;
    if (!name){ err.textContent = t('missing_fields'); return; }
    const reg = await api('/api/auth/register', { method:'POST', body:{ name, email, password:pass, role } });
    if (reg.error){ err.textContent = t(reg.error); return; }
    token = reg.token; localStorage.setItem('rejivan_token', token);
    me = reg.user;
    ok.textContent = t('register_success');
  } else {
    const res = await api('/api/auth/login', { method:'POST', body:{ email, password:pass } });
    if (res.error){ err.textContent = t('wrong_creds'); return; }
    token = res.token; localStorage.setItem('rejivan_token', token);
    me = res.user;
  }
  await enterApp();
}
async function doLogout(){
  try { await api('/api/auth/logout', { method:'POST' }); } catch(_){}
  token = ''; me = null; localStorage.removeItem('rejivan_token');
  clearLive();
  showLogin();
}
async function enterApp(){
  showApp();
  document.getElementById('whoami').textContent = me.name + ' · ' + t(me.role === 'ward' ? 'ward_role' : 'family_role');
  await refreshMeds();
  await poll();
  setInterval(poll, 2500);
}

document.getElementById('liSubmit').addEventListener('click', doLogin);
function fillDemo(email, pass){
  document.getElementById('liEmail').value = email;
  document.getElementById('liPass').value = pass;
  doLogin();
}
document.getElementById('liPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('liEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('liSwitch').addEventListener('click', ()=>{ mode = mode==='login' ? 'register' : 'login'; setLoginStrings(); });

// ---- Nav ------------------------------------------------------------------
const NAV = [
  ['dashboard','nav_dashboard'], ['medications','nav_medications'], ['cameras','nav_cameras'],
  ['ward','nav_ward'], ['alerts','nav_alerts'], ['devices','nav_devices'],
];
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(([v,k])=>`<button data-view="${v}" class="navitem ${v===state.view?'active':''}" data-i18n="${k}"></button>`).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.view = b.dataset.view;
      if (b.dataset.view !== 'cameras') clearLive();
      render();
    });
  });
  walk(nav);
}

function render(){
  buildNav();
  const viewsEl = document.getElementById('views');
  viewsEl.classList.remove('clearview');
  void viewsEl.offsetWidth;
  viewsEl.innerHTML = VIEWS[state.view]();
  viewsEl.classList.add('clearview');
  walk(viewsEl);
}

// ---- Views -----------------------------------------------------------------
function overall(p){
  const r = p.report ? p.report : {};
  if ((r.hr&&r.hr.status)==='danger'||(r.spo2&&r.spo2.status)==='danger'||r.bp==='danger'||(r.temp&&r.temp.status)==='danger'||(r.glucose&&r.glucose.status)==='danger') return 'danger';
  if ((r.hr&&r.hr.status)==='caution'||(r.spo2&&r.spo2.status)==='caution'||r.bp==='caution'||(r.temp&&r.temp.status)==='caution'||(r.glucose&&r.glucose.status)==='caution') return 'caution';
  return 'normal';
}
const __hist = {};
let __LASTUPD = '';

function overall(p){
  const r = p.report || {};
  const arr = [r.hr && r.hr.status, r.spo2 && r.spo2.status, r.bp, r.temp && r.temp.status, r.glucose && r.glucose.status];
  if (arr.includes('danger')) return 'danger';
  if (arr.includes('caution')) return 'caution';
  return 'normal';
}
function statusChip(status, label){
  const lbl = label || t(status);
  return `<span class="st ${status}" role="status"><span class="dot"></span>${lbl}</span>`;
}
function trendOf(id, metric, cur){
  const arr = (__hist[id] && __hist[id][metric]) || [];
  if (arr.length < 2 || cur == null) return { d:'flat', ch:'–' };
  const prev = arr[arr.length-2];
  if (prev == null) return { d:'flat', ch:'–' };
  const diff = cur - prev;
  if (Math.abs(diff) < 1.5) return { d:'flat', ch:'→' };
  return { d: diff < 0 ? 'down' : 'up', ch: diff < 0 ? '▼' : '▲' };
}
function readout(value, unit, fix){
  if (value === null || value === undefined || value === '') return '<span class="muted">—</span>';
  let v = value;
  try { v = (fix !== undefined && fix !== null) ? Number(value).toFixed(fix) : value; } catch(_){}
  return `<span class="nums">${v}</span>${unit ? `<span class="u">${unit}</span>` : ''}`;
}
function techLine(p){
  const rel = p.reliability || {};
  const conf = rel.confidence || 0;
  const degraded = rel.degradation && rel.degradation.missing && rel.degradation.missing.length;
  const devices = (p.devices || []).filter(d => d.connected && d.productionTier === 'medical');
  const devs = devices.length ? devices.slice(0,4).map(d =>
    `<span class="devchip"><span class="dot"></span>${d.name.split(' ').slice(0,2).join(' ')}</span>`).join(' ')
    : '<span class="muted">—</span>';
  const deg = degraded ? ` · <span style="color:var(--warn)">${rel.degradation.warning}</span>` : '';
  return `<div class="devs">${devs}</div>
    <span data-i18n="device_reliability"></span>: <b class="nums">${conf}%</b>

// ---- Poll ------------------------------------------------------------------
async function poll(){
  const d = await api('/api/vitals');
  state.patients = d.patients;
  for (const p of state.patients){
    if (!__hist[p.id]) __hist[p.id] = {}; 
    const v = p.vitals || {};
    for (const m of ['hr','spo2','sbp','temp','glucose']){
      if (v[m] == null) continue;
      if (!__hist[p.id][m]) __hist[p.id][m] = [];
      const arr = __hist[p.id][m];
      arr.push(Number(v[m]));
      if (arr.length > 15) arr.shift();
    }
  }
  __LASTUPD = fmtClock(new Date());
  const ad = await api('/api/alerts');
  state.alerts = ad.alerts; state.escalations = ad.escalations;
  const cd = await api('/api/camera-zones');
  state.zones = cd.zones; state.camEvents = cd.events;
  const cld = await api('/api/calls');
  state.calls = cld.calls || [];
  const dd = await api('/api/devices');
  state.devices = dd.patients || [];
  if (!state.catalogue) {
    const cat = await api('/api/devices/catalogue');
    state.catalogue = cat.catalogue || [];
  }
  render();
}

function openLive(zoneId){
  const zone = state.zones.find(z=>z.id===zoneId);
  if(!zone) return;
  live.zoneId = zoneId;
  live.name = pname(zone.patientId, '');
  document.getElementById('liveTitle').textContent = live.name + ' · ' + zone.name;
  document.getElementById('liveModal').classList.add('show');
  walk(document.getElementById('liveModal'));
  connectLive();
}
function closeLive(){ disconnectLive(); document.getElementById('liveModal').classList.remove('show'); live.zoneId=null; }
function toggleLive(){ live.connected ? disconnectLive() : connectLive(); }
function connectLive(){
  live.connected = true;
  document.getElementById('liveToggle').textContent = t('disconnect');
  document.getElementById('liveToggle').setAttribute('data-i18n','disconnect');
  live.timer = setInterval(fetchFrame, 1200);
  fetchFrame();
}
function disconnectLive(){
  live.connected = false;
  document.getElementById('liveToggle').textContent = t('connect');
  document.getElementById('liveToggle').setAttribute('data-i18n','connect');
  clearInterval(live.timer); live.timer = null;
}
async function fetchFrame(){
  if(!live.zoneId || !live.connected) return;
  const d = await api('/api/camera-zones/'+live.zoneId+'/live');
  if(d.frame){ live.frame = d.frame; document.getElementById('liveClock').textContent = new Date(d.frame.ts).toLocaleTimeString(); }
  drawCam();
}
function drawCam(){
  const cv = document.getElementById('camCanvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const W=cv.width, H=cv.height;
  const f = live.frame || { motion:0.4, person:true, lighting:'day' };

  // room gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, f.lighting==='night' ? '#0c1220' : '#223344');
  g.addColorStop(1, f.lighting==='night' ? '#060a12' : '#101a26');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // window (light)
  ctx.fillStyle = f.lighting==='night' ? '#1a2440' : '#a8c8ff';
  ctx.fillRect(40,50,120,110);
  ctx.strokeStyle='#33465c'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(100,50); ctx.lineTo(100,160); ctx.moveTo(40,105); ctx.lineTo(160,105); ctx.stroke();

  // door
  ctx.fillStyle='#2b3b50'; ctx.fillRect(520,160,70,140);
  ctx.strokeStyle='#33465c'; ctx.strokeRect(520,160,70,140);
  ctx.beginPath(); ctx.arc(578,230,4,0,7); ctx.fillStyle='#93a3b8'; ctx.fill();

  // floor line
  ctx.strokeStyle='#33465c'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,300); ctx.lineTo(W,300); ctx.stroke();

  // bed
  ctx.fillStyle='#24455c'; ctx.fillRect(140,220,230,70);
  ctx.fillStyle='#2c4f6b'; ctx.fillRect(140,215,230,18);
  ctx.fillStyle='#d8e2ee'; ctx.fillRect(150,222,70,14); // pillow

  // person marker (sways with motion)
  if (f.person){
    const sway = Math.sin(Date.now()/220)*6 + f.motion*10;
    const x = 300+sway, y = 255-(20+f.motion*10);
    ctx.fillStyle='#e8eef7'; ctx.beginPath(); ctx.arc(x, y-10, 10, 0, 7); ctx.fill();
    ctx.strokeStyle='#e8eef7'; ctx.lineWidth=7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,y+2); ctx.lineTo(x,y+34); ctx.moveTo(x,y+10); ctx.lineTo(x-14,y+30); ctx.moveTo(x,y+10); ctx.lineTo(x+14,y+30); ctx.stroke();
  }

  // dimming at night
  if (f.lighting==='night'){ ctx.fillStyle='rgba(4,8,16,0.45)'; ctx.fillRect(0,0,W,H); }

  // HUD text bottom
  ctx.font='11px Segoe UI'; ctx.fillStyle='#7fd9b8';
  ctx.fillText((f.person ? '● person detected' : '○ no person') + '   motion ' + Math.round(f.motion*100) + '%', 12, H-14);
  ctx.fillStyle='#93a3b8';
  ctx.fillText('SIMULATED · ', W-200, H-14);
}
function clearLive(){ disconnectLive(); }
