<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReJivan</title>
<link rel="manifest" href="/manifest.json" />
<style>
  :root{
    --bg:#0e1420; --panel:#171f2e; --panel2:#1c2738; --line:#2a3648;
    --txt:#e8eef7; --muted:#93a3b8; --accent:#2fbf8f; --accent2:#35a7ff;
    --warn:#f5b14c; --danger:#f2576b; --ok:#2fbf8f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  a{color:var(--accent2);cursor:pointer}
  header{background:linear-gradient(90deg,#123, #0e1420);padding:14px 22px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .logo{font-size:22px;font-weight:800;color:var(--accent)}
  header .tag{color:var(--muted);font-size:13px}
  header .spacer{flex:1}
  .lang-select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:8px}
  .userchip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px}
  .userchip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  nav{display:flex;gap:4px;padding:8px 22px;border-bottom:1px solid var(--line);background:#111927;flex-wrap:wrap}
  nav button{background:none;border:none;color:var(--muted);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
  nav button:hover{background:var(--panel2);color:var(--txt)}
  nav button.active{background:var(--accent);color:#06231b;font-weight:700}
  main{padding:20px 22px;max-width:1300px;margin:0 auto}
  .banner{background:#14303a;border:1px solid #1f4a57;color:#bfe9f5;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:18px}
  .banner.region{background:#3a3106;border-color:#5a4d0a;color:#ffeeb0;margin-top:-8px;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
  .card h3{margin:0 0 4px;font-size:16px}
  .card .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  .vitals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .vital{background:var(--panel2);border-radius:10px;padding:10px;min-width:0;overflow:hidden}
  .vital .top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
  .vital .label{font-size:11px;color:var(--muted)}
  .vital .value{font-size:20px;font-weight:700;margin-top:6px;white-space:nowrap}
  .vital .unit{font-size:11px;color:var(--muted);font-weight:400}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .badge.normal{background:#123528;color:#4ee0a8}
  .badge.caution{background:#3a2d16;color:var(--warn)}
  .badge.danger{background:#3a1821;color:var(--danger)}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill.live{background:#123528;color:#4ee0a8}
  .pill.sim{background:#3a2d16;color:var(--warn)}
  .alert{background:var(--panel2);border-left:4px solid var(--danger);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .alert.caution{border-left-color:var(--warn)}
  .alert .time{font-size:11px;color:var(--muted)}
  .alert .sev{float:right}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--accent);border:none;color:#06231b;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.small{padding:5px 10px;font-size:12px}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px;border-radius:8px;width:100%;margin:4px 0}
  label{font-size:12px;color:var(--muted);display:block;margin-top:6px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(460px,92vw)}
  .table{width:100%;border-collapse:collapse}
  .table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
  .table th{color:var(--muted);font-weight:600}
  .muted{color:var(--muted)}
  .confidence{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .confidence.high{background:#123528;color:#4ee0a8}
  .confidence.medium{background:#3a2d16;color:var(--warn)}
  .confidence.low{background:#3a1821;color:var(--danger)}
  .reliability-bar{height:3px;border-radius:2px;margin-top:4px}
  .reliability-bar.high{background:var(--ok)}
  .reliability-bar.medium{background:var(--warn)}
  .reliability-bar.low{background:var(--danger)}
  .sensor-badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:700;margin-left:4px}
  .sensor-badge.ok{background:#123528;color:#4ee0a8}
  .sensor-badge.off{background:#3a1821;color:var(--danger)}
  .stat{font-size:12px;color:var(--muted)}
  .wardbed{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;border-left:4px solid var(--ok)}
  .wardbed.danger{border-left-color:var(--danger)}
  .wardbed.caution{border-left-color:var(--warn)}
  .flow{display:flex;gap:20px;flex-wrap:wrap}
  .flow .col{flex:1;min-width:300px}
  .empty{color:var(--muted);text-align:center;padding:22px}
  .foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .err{color:var(--danger);font-size:13px;min-height:18px;margin:6px 0}
  .okmsg{color:var(--ok);font-size:13px;min-height:18px;margin:6px 0}

  /* Medical devices */
  .device-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .device-row:last-child{border-bottom:none}
  .device-dot{width:10px;height:10px;border-radius:50%;flex:none}
  .device-dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .device-dot.off{background:var(--danger)}
  .device-name{font-weight:700;font-size:13px}
  .device-meta{font-size:11px;color:var(--muted)}
  .device-badge{font-size:9px;padding:2px 6px;border-radius:8px;font-weight:700;flex:none}
  .device-badge.connected{background:#123528;color:#4ee0a8}
  .device-badge.disconnected{background:#3a1821;color:var(--danger)}
  .device-badge.indian{background:#1a2540;color:var(--accent2)}
  .battery-bar{width:40px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;flex:none}
  .battery-fill{height:100%;border-radius:3px}
  .battery-fill.high{background:var(--ok)}
  .battery-fill.mid{background:var(--warn)}
  .battery-fill.low{background:var(--danger)}
  .signal-bars{display:flex;align-items:flex-end;gap:1px;height:12px;flex:none}
  .signal-bars span{width:3px;background:var(--muted);border-radius:1px}
  .signal-bars span.on{background:var(--ok)}
  .catalogue-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
  .catalogue-card h4{margin:0 0 2px;font-size:14px}
  .catalogue-card .sub{font-size:11px;color:var(--muted)}
  .catalogue-card .price{font-size:13px;font-weight:700;color:var(--accent);margin-top:6px}
  .catalogue-card .measures{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .catalogue-card .measures span{background:var(--panel2);border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:10px}

  /* Login screen */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(1200px 500px at 50% -10%, #123b33, var(--bg))}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;width:min(400px,94vw)}
  .login-card h1{margin:0 0 2px;color:var(--accent);font-size:26px}
  .login-card .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .login-card .demo{background:#111927;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);margin-top:14px}
  .login-card .demo b{color:var(--txt)}
  .link{margin-top:10px;font-size:13px}

  /* Live camera */
  .cam-stage{position:relative;background:#0a0f18;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cam-stage canvas{width:100%;height:auto;display:block}
  .cam-hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;pointer-events:none}
  .cam-banner{margin-top:10px;background:#14303a;border:1px solid #1f4a57;color:#bfe9f5;padding:8px 12px;border-radius:8px;font-size:12px}
  .callcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .callstep{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .callstep:last-child{border-bottom:none}
  .callstep .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
  .callstep.pending .dot{background:#4a5a70}
  .callstep.dialing .dot{background:var(--warn);animation:pulse 1s infinite}
  .callstep.answered .dot{background:var(--ok)}
  .callstep.unanswered .dot{background:var(--danger)}
  @keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>

<!-- LOGIN / REGISTER SCREEN -->
<div id="loginScreen" class="login-wrap" style="display:none">
  <div class="login-card">
    <h1>ReJivan</h1>
    <div class="sub" data-i18n="login_sub"></div>
    <input id="liName" type="text" style="display:none" data-i18n-ph="login_name" />
    <input id="liEmail" type="email" autocomplete="email" data-i18n-ph="login_email" />
    <input id="liPass" type="password" autocomplete="current-password" data-i18n-ph="login_password" />
    <select id="liRole" style="display:none">
      <option value="family" data-i18n="family_role"></option>
      <option value="ward" data-i18n="ward_role"></option>
    </select>
    <div class="err" id="liErr"></div>
    <div class="okmsg" id="liOk"></div>
    <button class="btn" id="liSubmit" style="width:100%;margin-top:6px" data-i18n="login_btn"></button>
    <div class="link" id="liSwitch"></div>
    <div class="demo"><b data-i18n="demo_accounts"></b><br>
      <a onclick="fillDemo('asharma@demo.in','demo123')">asharma@demo.in · demo123</a> <span class="muted">(Anita — home)</span><br>
      <a onclick="fillDemo('rprakash@demo.in','demo123')">rprakash@demo.in · demo123</a> <span class="muted">(Ram — home)</span><br>
      <a onclick="fillDemo('wardnurse@demo.in','demo123')">wardnurse@demo.in · demo123</a> <span class="muted">(Virtual Ward)</span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
<header>
  <div class="logo">&#x2714; ReJivan</div>
  <div class="tag" data-i18n="tagline"></div>
  <div class="spacer"></div>
  <span class="pill live" data-i18n="live"></span>
  <span class="pill sim" data-i18n="simulated"></span>
  <span class="userchip"><span class="dot"></span><span id="whoami"></span></span>
  <button class="btn ghost small" onclick="doLogout()" data-i18n="nav_logout"></button>
  <select id="langSel" class="lang-select">
    <option value="en">English</option>
    <option value="hi">हिंदी</option>
    <option value="bn">বাংলা</option>
    <option value="ta">தமிழ்</option>
    <option value="te">తెలుగు</option>
  </select>
</header>

<nav id="nav"></nav>

<main>
  <div class="banner" data-i18n="sim_banner"></div>
  <div class="banner region" data-i18n="region_note"></div>
  <div id="views"></div>
  <div class="foot" data-i18n="disclaimer"></div>
</main>
</div>

<!-- MEDICINE MODAL -->
<div class="modal" id="medModal">
  <div class="modal-card">
    <h3 data-i18n="add_med"></h3>
    <label data-i18n="med_name"></label>
    <input id="mName" />
    <label data-i18n="dose"></label>
    <input id="mDose" />
    <label data-i18n="frequency"></label>
    <input id="mFreq" value="daily" />
    <label data-i18n="times"></label>
    <input id="mTimes" value="08:00, 20:00" />
    <select id="mPatient" style="margin-top:8px"></select>
    <div style="margin-top:12px" class="row">
      <button class="btn" id="mSave" data-i18n="add_med"></button>
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<!-- LIVE CAMERA MODAL -->
<div class="modal" id="liveModal">
  <div class="modal-card" style="width:min(640px,94vw)">
    <div class="flex-between" style="margin-bottom:10px">
      <h3 style="margin:0" id="liveTitle"></h3>
      <button class="btn ghost small" onclick="closeLive()">✕</button>
    </div>
    <div class="cam-stage">
      <canvas id="camCanvas" width="640" height="360"></canvas>
      <div class="cam-hud"><span class="pill live" id="liveState">LIVE · SIMULATED</span><span class="muted" id="liveClock"></span></div>
    </div>
    <div class="cam-banner" data-i18n="live_banner"></div>
    <div class="cam-banner" data-i18n="live_note" style="margin-top:6px"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="liveToggle" onclick="toggleLive()"></button>
    </div>
  </div>
</div>

<script>
const LANG = {};
let curLang = localStorage.getItem('rejivan_lang') || 'en';
let token = localStorage.getItem('rejivan_token') || '';
let me = null;
let mode = 'login'; // login | register

const state = { view: 'dashboard', patients: [], alerts: [], escalations: [], meds: [], zones: [], camEvents: [], calls: [] };
let live = { zoneId: null, connected: false, timer: null, raf: null, frame: null, name: '' };

function t(key){ return LANG[curLang] && LANG[curLang][key] ? LANG[curLang][key] : (LANG.en?.[key] || key); }
function pname(id, fallback){ return (LANG[curLang]?.patientNames?.[id]) || fallback || id || ''; }
function stripName(msg, name){
  if (!msg || !name) return msg || '';
  if (msg.startsWith(name)) return msg.slice(name.length).replace(/^\s*[—–-]\s*/, '');
  return msg;
}
function walk(node){ node.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n)); }
function walkPlaceholders(node){ node.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18n)); }

function applyI18n(){
  curLang = localStorage.getItem('rejivan_lang') || 'en';
  const sel = document.getElementById('langSel');
  if (sel) sel.value = curLang;
  document.querySelectorAll('[id]').forEach(()=>{}); // no-op
  walkForTrees();
  document.title = t('appName');
}
function walkForTrees(){
  walk(document.getElementById('loginScreen'));
  walk(document.getElementById('app'));
  walk(document.getElementById('medModal'));
  walk(document.getElementById('liveModal'));
  walkPlaceholders(document.getElementById('loginScreen'));
  walk(dynamicEl());
}
function dynamicEl(){ return document.getElementById('views'); }
function setLoginStrings(){
  document.getElementById('liSubmit').textContent = t(mode === 'login' ? 'login_btn' : 'register_btn');
  document.getElementById('liSwitch').innerHTML = mode === 'login'
    ? t('switch_to_register') : t('switch_to_login');
  document.getElementById('liName').style.display = mode === 'register' ? '' : 'none';
  document.getElementById('liRole').style.display = mode === 'register' ? '' : 'none';
}

async function loadLang(){
  const r = await fetch('/lang.json');
  Object.assign(LANG, await r.json());
}

async function api(path, opts={}){
  opts.headers = opts.headers || {};
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (opts.body && typeof opts.body !== 'string') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith('/api/auth/')) {
    token = '';
    localStorage.removeItem('rejivan_token');
    showLogin();
    const err = document.getElementById('liErr');
    if (err) err.textContent = t('auth_required');
    throw new Error('auth_required');
  }
  return data;
}

// ---- Auth UI --------------------------------------------------------------
function showLogin(){ document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('app').style.display = 'none'; walkForTrees(); setLoginStrings(); }
function showApp(){ document.getElementById('loginScreen').style.display = 'none'; document.getElementById('app').style.display = 'block'; walkForTrees(); buildNav(); }

async function doLogin(){
  const email = document.getElementById('liEmail').value.trim();
  const pass = document.getElementById('liPass').value.trim();
  const err = document.getElementById('liErr');
  const ok = document.getElementById('liOk');
  err.textContent = ''; ok.textContent = '';
  if (!email || !pass){ err.textContent = t('wrong_creds'); return; }
  if (mode === 'register') {
    const name = document.getElementById('liName').value.trim();
    const role = document.getElementById('liRole').value;
    if (!name){ err.textContent = t('missing_fields'); return; }
    const reg = await api('/api/auth/register', { method:'POST', body:{ name, email, password:pass, role } });
    if (reg.error){ err.textContent = t(reg.error); return; }
    token = reg.token; localStorage.setItem('rejivan_token', token);
    me = reg.user;
    ok.textContent = t('register_success');
  } else {
    const res = await api('/api/auth/login', { method:'POST', body:{ email, password:pass } });
    if (res.error){ err.textContent = t('wrong_creds'); return; }
    token = res.token; localStorage.setItem('rejivan_token', token);
    me = res.user;
  }
  await enterApp();
}
async function doLogout(){
  try { await api('/api/auth/logout', { method:'POST' }); } catch(_){}
  token = ''; me = null; localStorage.removeItem('rejivan_token');
  clearLive();
  showLogin();
}
async function enterApp(){
  showApp();
  document.getElementById('whoami').textContent = me.name + ' · ' + t(me.role === 'ward' ? 'ward_role' : 'family_role');
  await refreshMeds();
  await poll();
  setInterval(poll, 2500);
}

document.getElementById('liSubmit').addEventListener('click', doLogin);
function fillDemo(email, pass){
  document.getElementById('liEmail').value = email;
  document.getElementById('liPass').value = pass;
  doLogin();
}
document.getElementById('liPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('liEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('liSwitch').addEventListener('click', ()=>{ mode = mode==='login' ? 'register' : 'login'; setLoginStrings(); });

// ---- Nav ------------------------------------------------------------------
const NAV = [
  ['dashboard','nav_dashboard'], ['medications','nav_medications'], ['cameras','nav_cameras'],
  ['ward','nav_ward'], ['alerts','nav_alerts'], ['devices','nav_devices'],
];
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(([v,k])=>`<button data-view="${v}" class="${v===state.view?'active':''}" data-i18n="${k}"></button>`).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.view = b.dataset.view;
      if (b.dataset.view !== 'cameras') clearLive();
      render();
    });
  });
  walk(nav);
}

function render(){
  buildNav();
  const viewsEl = document.getElementById('views');
  viewsEl.innerHTML = VIEWS[state.view]();
  walk(viewsEl);
}

// ---- Views -----------------------------------------------------------------
function statusBadge(status){ return `<span class="badge ${status}">${t(status)}</span>`; }
function vitalCard(m, value, unit, status){
  return `<div class="vital">
    <div class="top"><span class="label">${t(m)}</span>${statusBadge(status)}</div>
    <div class="value">${value} <span class="unit">${unit||''}</span></div>
  </div>`;
}
function overall(p){
  const r = p.report; const arr=[r.hr.status,r.spo2.status,r.bp,r.temp.status,r.glucose.status];
  if(arr.includes('danger')) return 'danger';
  if(arr.includes('caution')) return 'caution';
  return 'normal';
}
function overallLabel(p){ return t(overall(p)); }

function patientCard(p){
  const v = p.vitals; const rep = p.report;
  const loc = p.ward || p.location;
  const rel = p.reliability || {};
  const conf = rel.confidence || 0;
  const confClass = conf >= 75 ? 'high' : conf >= 50 ? 'medium' : 'low';
  const confLabel = conf >= 75 ? t('high_reliability') : conf >= 50 ? t('medium_reliability') : t('low_reliability');
  const degraded = rel.degradation && rel.degradation.missing && rel.degradation.missing.length > 0;
  const devices = p.devices || [];
  const medDevices = devices.filter(d => d.connected && d.productionTier === 'medical');
  const deviceBadges = medDevices.map(d => `<span style="background:#1a2540;border:1px solid #2a4570;padding:1px 5px;border-radius:4px;font-size:9px;color:var(--accent2)">● ${d.name.split(' ').slice(0,2).join(' ')}</span>`).join(' ');
  return `<div class="card">
    <div class="flex-between">
      <div><h3>${pname(p.id, p.name)}</h3><div class="sub">${p.age} · ${loc}${p.addr ? ' · ' + p.addr : ''}</div></div>
      <div style="text-align:right">
        <span class="badge ${overall(p)}">${overallLabel(p)}</span>
        <div class="confidence ${confClass}" title="${t('confidence_title')}: ${conf}%">${t('confidence')}: ${conf}%</div>
      </div>
    </div>
    <div class="reliability-bar ${confClass}" style="width:${conf}%"></div>
    ${degraded ? `<div class="stat" style="color:var(--warn);margin:6px 0">⚠ ${rel.degradation.warning}</div>` : ''}
    ${deviceBadges ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin:6px 0">${deviceBadges}</div>` : ''}
    <div class="vitals">
      ${vitalCard('hr', v.hr, t('bpm'), rep.hr.status)}
      ${vitalCard('spo2', v.spo2 !== null ? v.spo2+'%' : '—', '', v.spo2 !== null ? rep.spo2.status : 'danger')}
      ${vitalCard('bp', v.sbp !== null && v.dbp !== null ? v.sbp+'/'+v.dbp : '—', v.sbp !== null ? t('mmhg') : '', v.sbp !== null ? rep.bp : 'danger')}
      ${vitalCard('temp', v.temp !== null ? v.temp+'°C' : '—', '', v.temp !== null ? rep.temp.status : 'danger')}
      ${vitalCard('glucose', v.glucose !== null ? v.glucose : '—', v.glucose !== null ? 'mg/dL' : '', v.glucose !== null ? rep.glucose.status : 'danger')}
    </div>
  </div>`;
}

function dashboardView(){
  const healthy = state.patients.filter(p=>overall(p)==='normal').length;
  const caution = state.patients.filter(p=>overall(p)==='caution').length;
  const danger = state.patients.filter(p=>overall(p)==='danger').length;
  return `
    <div class="row" style="margin-bottom:18px;gap:24px">
      <div class="stat"><span style="font-size:26px;font-weight:800;color:var(--ok)">${healthy}</span> ${t('normal')}</div>
      <div class="stat"><span style="font-size:26px;font-weight:800;color:var(--warn)">${caution}</span> ${t('caution')}</div>
      <div class="stat"><span style="font-size:26px;font-weight:800;color:var(--danger)">${danger}</span> ${t('danger')}</div>
    </div>
    <div class="grid">${state.patients.map(patientCard).join('')}</div>`;
}

function medicationsView(){
  return `
    <div class="row" style="margin-bottom:14px">
      <h2 style="margin:0" data-i18n="nav_medications"></h2>
      <div class="spacer" style="flex:1"></div>
      <button class="btn" onclick="openModal()" data-i18n="add_med"></button>
    </div>
    <div class="card"><table class="table">
      <tr><th data-i18n="med_name"></th><th data-i18n="dose"></th><th data-i18n="frequency"></th><th data-i18n="times"></th><th data-i18n="mark_taken"></th></tr>
      ${state.meds.map(m=>`<tr>
        <td>${m.name}</td><td>${m.dose}</td><td>${m.frequency}</td>
        <td>${m.times.join(', ')}</td>
        <td><button class="btn ghost small" onclick="takeMed('${m.id}')" data-i18n="mark_taken"></button></td>
      </tr>`).join('') || `<tr><td colspan="5" class="empty">—</td></tr>`}
    </table></div>`;
}

function camerasView(){
  return `<div class="flow">
    <div class="col">
      <h2 data-i18n="camera_zones"></h2>
      <div class="grid">${state.zones.map(z=>`
        <div class="card"><div class="flex-between"><h3>${z.name}</h3><button class="btn small" onclick="openLive('${z.id}')" data-i18n="view_live"></button></div>
          <div class="sub">${pname(z.patientId, '')} · ${z.room} · <span class="muted">Privacy-first · no video recorded</span></div>
          <div class="stat" style="margin-top:8px">&#x1F50A; On-device Prajñā: fall · out-of-bed · low activity</div>
        </div>`).join('') || `<div class="empty">—</div>`}
      </div>
    </div>
    <div class="col">
      <h2 data-i18n="events"></h2>
      ${state.camEvents.slice(0,10).map(e=>`
        <div class="alert ${e.severity}"><span class="sev">${statusBadge(e.severity)}</span>
          <b>${pname(e.patientId, '')} · ${e.zoneName}</b><br>${e.message}
          <div class="time">${new Date(e.at).toLocaleTimeString()}</div></div>`).join('') || `<div class="empty">${t('no_alerts')}</div>`}
    </div>
  </div>`;
}

function wardView(){
  const wardPats = state.patients.filter(p=>p.ward);
  return `<h2 data-i18n="ward_view"></h2>
  <div class="flow">
    ${wardPats.map(p=>{
      const cls = overall(p)+'bed';
      const prio = overall(p)==='danger'?'HIGH':overall(p)==='caution'?'MEDIUM':'NORMAL';
      return `<div class="wardbed ${cls}">
        <div style="flex:1">
          <b>${p.ward}</b> · ${pname(p.id, p.name)}, ${p.age}
          <div class="sub">${p.addr || ''}</div>
          <div class="stat">${t('hr')}: ${p.vitals.hr} · ${t('spo2')}: ${p.vitals.spo2}% · ${t('bp')}: ${p.vitals.sbp}/${p.vitals.dbp}</div>
        </div>
        <div><span class="badge ${overall(p)}">${t(overall(p))}</span></div>
        <div class="stat" style="font-weight:700;color:var(--accent2)">${prio}</div>
      </div>`;
    }).join('') || `<div class="empty">—</div>`}
  </div>`;
}

function devicesView(){
  if (!state.devices || !state.devices.length) return `<div class="empty">${t('loading')}</div>`;
  // Group by patient
  const rows = state.devices.map(d => {
    const devRows = d.devices.map(dev => {
      const connClass = dev.connected ? 'connected' : 'disconnected';
      const connLabel = dev.connected ? t('device_connected') : t('device_disconnected');
      const batLevel = dev.battery > 50 ? 'high' : dev.battery > 20 ? 'mid' : 'low';
      const signalBars = Math.ceil(dev.signalStrength / 25);
      const indianBadge = dev.madeInIndia ? `<span class="device-badge indian">🇮🇳 Made in India</span>` : '';
      return `<div class="device-row">
        <div class="device-dot ${dev.connected?'on':'off'}"></div>
        <div style="flex:1;min-width:0">
          <div class="device-name">${dev.name}</div>
          <div class="device-meta">${dev.manufacturer} · ${dev.approval}</div>
          <div class="device-meta">${dev.connectivity} · ${dev.description ? dev.description.substring(0, 80) + '...' : ''}</div>
          <div class="measures" style="display:flex;gap:3px;margin-top:4px">${(dev.measures||[]).map(m => `<span style="background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:9px">${t(m)}</span>`).join('')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span class="device-badge ${connClass}">${connLabel}</span>
          <div class="battery-bar"><div class="battery-fill ${batLevel}" style="width:${dev.battery}%"></div></div>
          <div class="device-meta">${dev.battery}% · ${dev.secondsSinceLastSeen}s ago</div>
          <div class="signal-bars">${[1,2,3,4].map(i => `<span style="height:${i*3}px" class="${i<=signalBars?'on':''}"></span>`).join('')}</div>
          ${indianBadge}
        </div>
      </div>`;
    }).join('');
    return `<div class="card" style="margin-bottom:16px">
      <h3>${pname(d.patientId, d.patientName)} — ${t('connected_devices')}</h3>
      <div class="stat" style="margin-bottom:8px">${d.devices.length} ${t('device_count')} · ${d.devices.filter(x=>x.connected).length} ${t('device_online')}</div>
      ${devRows || `<div class="empty">${t('no_devices')}</div>`}
    </div>`;
  }).join('');
  return `<h2 data-i18n="nav_devices"></h2>
  <div class="banner" style="background:#1a2540;border-color:#2a4570;color:#a0c4ff;margin-bottom:14px" data-i18n="device_banner"></div>
  ${rows}
  <h3 style="margin-top:22px" data-i18n="device_catalogue_title"></h3>
  <div class="stat" style="margin-bottom:12px" data-i18n="device_catalogue_sub"></div>
  <div class="grid">${(state.catalogue||[]).map(c => `
    <div class="catalogue-card">
      <div class="flex-between">
        <h4>${c.name}</h4>
        ${c.madeInIndia ? '<span class="device-badge indian">🇮🇳</span>' : ''}
      </div>
      <div class="sub">${c.manufacturer} · ${c.approval}</div>
      <div class="price">₹${parseInt(c.priceINR).toLocaleString('en-IN')}</div>
      <div class="measures">${(c.measures||[]).map(m => `<span>${t(m)}</span>`).join('')}</div>
      <div class="device-meta" style="margin-top:6px">${c.description||''}</div>
    </div>`).join('')}
  </div>`;
}

function alertsView(){
  const callSteps = (st, idx) => `
    <div class="callstep ${st.state}">
      <span class="dot"></span>
      <span>${t(idx===0?'family': idx===1?'backup':'emergency')}</span>
      <span class="muted" style="flex:1">${st.to} · ${st.mode}</span>
      ${st.state==='answered' ? `<span class="badge normal">${t('answered')}</span>`
        : st.state==='unanswered' ? `<span class="badge danger">${t('unanswered')}</span>`
        : st.state==='dialing' ? `<span class="badge caution">${t('dialing')}</span>` : ''}
    </div>`;
  return `<div class="flow">
    <div class="col"><h2 data-i18n="alerts_feed"></h2>
      ${state.alerts.slice(0,15).map(a=>`
        <div class="alert ${a.severity}"><span class="sev">${statusBadge(a.severity)}</span>
          <b>${pname(a.patientId, a.patientName)}</b> — ${stripName(a.message, a.patientName)}
          <div class="time">${new Date(a.createdAt).toLocaleTimeString()}</div></div>`).join('') || `<div class="empty">${t('no_alerts')}</div>`}
    </div>
    <div class="col"><h2 data-i18n="escalations"></h2>
      ${state.escalations.slice(0,10).map(e=>`
        <div class="alert"><b>${pname(e.patientId, e.patientName)}</b> · ${e.severity}
          <div>→ ${e.channels.join(' + ')} =&gt; ${e.to}</div>
          <div class="time">${new Date(e.dispatchedAt).toLocaleTimeString()}</div>
          <div class="stat" style="margin-top:4px">${e.simulationNotice}</div></div>`).join('') || `<div class="empty">—</div>`}
      <h2 style="margin-top:22px" data-i18n="emergency_calls"></h2>
      <div class="cam-banner" data-i18n="sim_call"></div>
      ${state.calls.slice(0,6).map(c=>`
        <div class="callcard">
          <div class="flex-between"><b>${pname(c.patientId, c.patientName)}</b>
            <span class="badge ${c.status==='answered'||c.status==='dispatched'?'normal':c.status==='dialing'||c.status==='escalating'?'caution':'danger'}">${t(c.status)}</span></div>
          <div class="stat" style="margin:4px 0 6px">${new Date(c.startedAt).toLocaleTimeString()} · ${t('alert_ref')} ${c.alertId}</div>
          ${c.ladder.map(callSteps).join('')}
          <div class="stat" style="margin-top:6px">${c.log.map(l=>`· ${new Date(l.t).toLocaleTimeString()} ${l.msg}`).join('<br>')}</div>
        </div>`).join('') || `<div class="empty">—</div>`}
    </div>
  </div>`;
}

const VIEWS = { dashboard: dashboardView, medications: medicationsView, cameras: camerasView, ward: wardView, alerts: alertsView, devices: devicesView };

// ---- Medications modal -----------------------------------------------------
function openModal(){
  fillPatientSelect();
  document.getElementById('medModal').classList.add('show');
}
function fillPatientSelect(){
  const sel = document.getElementById('mPatient');
  sel.innerHTML = state.patients.map(p=>`<option value="${p.id}">${pname(p.id, p.name)}</option>`).join('');
}
function closeModal(){ document.getElementById('medModal').classList.remove('show'); }
document.getElementById('mSave').addEventListener('click', async ()=>{
  await api('/api/medications', { method:'POST', body:{
      patientId: document.getElementById('mPatient').value,
      name: document.getElementById('mName').value,
      dose: document.getElementById('mDose').value,
      frequency: document.getElementById('mFreq').value,
      times: document.getElementById('mTimes').value.split(',').map(s=>s.trim()),
  }});
  closeModal();
  await refreshMeds(); render();
});
async function takeMed(id){ await api('/api/medications/'+id+'/take', {method:'POST'}); await refreshMeds(); render(); }

async function refreshMeds(){ const d = await api('/api/medications'); state.meds = d.list; }

// ---- Poll ------------------------------------------------------------------
async function poll(){
  const d = await api('/api/vitals');
  state.patients = d.patients;
  const ad = await api('/api/alerts');
  state.alerts = ad.alerts; state.escalations = ad.escalations;
  const cd = await api('/api/camera-zones');
  state.zones = cd.zones; state.camEvents = cd.events;
  const cld = await api('/api/calls');
  state.calls = cld.calls || [];
  const dd = await api('/api/devices');
  state.devices = dd.patients || [];
  if (!state.catalogue) {
    const cat = await api('/api/devices/catalogue');
    state.catalogue = cat.catalogue || [];
  }
  render();
}

document.getElementById('langSel').addEventListener('change', e=>{
  localStorage.setItem('rejivan_lang', e.target.value);
  applyI18n(); render();
});

// ---- Live camera (SIMULATED, privacy-first) --------------------------------
function openLive(zoneId){
  const zone = state.zones.find(z=>z.id===zoneId);
  if(!zone) return;
  live.zoneId = zoneId;
  live.name = pname(zone.patientId, '');
  document.getElementById('liveTitle').textContent = live.name + ' · ' + zone.name;
  document.getElementById('liveModal').classList.add('show');
  walk(document.getElementById('liveModal'));
  connectLive();
}
function closeLive(){ disconnectLive(); document.getElementById('liveModal').classList.remove('show'); live.zoneId=null; }
function toggleLive(){ live.connected ? disconnectLive() : connectLive(); }
function connectLive(){
  live.connected = true;
  document.getElementById('liveToggle').textContent = t('disconnect');
  document.getElementById('liveToggle').setAttribute('data-i18n','disconnect');
  live.timer = setInterval(fetchFrame, 1200);
  fetchFrame();
}
function disconnectLive(){
  live.connected = false;
  document.getElementById('liveToggle').textContent = t('connect');
  document.getElementById('liveToggle').setAttribute('data-i18n','connect');
  clearInterval(live.timer); live.timer = null;
}
async function fetchFrame(){
  if(!live.zoneId || !live.connected) return;
  const d = await api('/api/camera-zones/'+live.zoneId+'/live');
  if(d.frame){ live.frame = d.frame; document.getElementById('liveClock').textContent = new Date(d.frame.ts).toLocaleTimeString(); }
  drawCam();
}
function drawCam(){
  const cv = document.getElementById('camCanvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const W=cv.width, H=cv.height;
  const f = live.frame || { motion:0.4, person:true, lighting:'day' };

  // room gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, f.lighting==='night' ? '#0c1220' : '#223344');
  g.addColorStop(1, f.lighting==='night' ? '#060a12' : '#101a26');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // window (light)
  ctx.fillStyle = f.lighting==='night' ? '#1a2440' : '#a8c8ff';
  ctx.fillRect(40,50,120,110);
  ctx.strokeStyle='#33465c'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(100,50); ctx.lineTo(100,160); ctx.moveTo(40,105); ctx.lineTo(160,105); ctx.stroke();

  // door
  ctx.fillStyle='#2b3b50'; ctx.fillRect(520,160,70,140);
  ctx.strokeStyle='#33465c'; ctx.strokeRect(520,160,70,140);
  ctx.beginPath(); ctx.arc(578,230,4,0,7); ctx.fillStyle='#93a3b8'; ctx.fill();

  // floor line
  ctx.strokeStyle='#33465c'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,300); ctx.lineTo(W,300); ctx.stroke();

  // bed
  ctx.fillStyle='#24455c'; ctx.fillRect(140,220,230,70);
  ctx.fillStyle='#2c4f6b'; ctx.fillRect(140,215,230,18);
  ctx.fillStyle='#d8e2ee'; ctx.fillRect(150,222,70,14); // pillow

  // person marker (sways with motion)
  if (f.person){
    const sway = Math.sin(Date.now()/220)*6 + f.motion*10;
    const x = 300+sway, y = 255-(20+f.motion*10);
    ctx.fillStyle='#e8eef7'; ctx.beginPath(); ctx.arc(x, y-10, 10, 0, 7); ctx.fill();
    ctx.strokeStyle='#e8eef7'; ctx.lineWidth=7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,y+2); ctx.lineTo(x,y+34); ctx.moveTo(x,y+10); ctx.lineTo(x-14,y+30); ctx.moveTo(x,y+10); ctx.lineTo(x+14,y+30); ctx.stroke();
  }

  // dimming at night
  if (f.lighting==='night'){ ctx.fillStyle='rgba(4,8,16,0.45)'; ctx.fillRect(0,0,W,H); }

  // HUD text bottom
  ctx.font='11px Segoe UI'; ctx.fillStyle='#7fd9b8';
  ctx.fillText((f.person ? '● person detected' : '○ no person') + '   motion ' + Math.round(f.motion*100) + '%', 12, H-14);
  ctx.fillStyle='#93a3b8';
  ctx.fillText('SIMULATED · ', W-200, H-14);
}
function clearLive(){ disconnectLive(); }

// ---- Init -------------------------------------------------------------------
async function init(){
  await loadLang();
  applyI18n();
  // restore session
  if (token){
    try {
      const d = await api('/api/me');
      if(d.user){ me = d.user; await enterApp(); return; }
    } catch(_){}
    token=''; localStorage.removeItem('rejivan_token');
  }
  showLogin();
}
init();
