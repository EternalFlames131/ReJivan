<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>autologin</title></head>
<body>
<script>
(async function(){
  try {
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email:'asharma@demo.in', password:'demo123'}) });
    const d = await r.json();
    if (d.token) {
      localStorage.setItem('rejivan_token', d.token);
      localStorage.setItem('rejivan_lang', 'en');
      location.href = '/';
    } else {
      document.title = 'LOGIN FAILED';
    }
  } catch (e) { document.title = 'AUTOLOGIN ERROR'; }
})();
</script>
</body>
</html>
